# Hand-maintained publications, merged with publications.yaml at build time.
#
# Use this file for anything the monthly fetcher (tools/fetch_publications.py)
# cannot find: venues other than arXiv / ePrint / the two Discourse forums /
# writings.flashbots.net, or when a source is down. The fetcher never writes
# here, and skips anything already listed here.
#
# Same structure as publications.yaml. A URL may appear in only one of the
# two files (the build fails otherwise). Quote any value containing ": ".
# Example:
#
# - category: Academic Papers
#   title: Some Paper Title
#   date: 2026-01-31
#   authors: Jane Doe (Flashbots), John Roe
#   url: https://example.org/paper
#   venue: AFT 2026                       # optional, see publications.yaml
#   also: https://writings.flashbots.net/a-long-read   # optional, see publications.yaml

# Not on a fetched source (publisher pages), or forum posts by former team
# members, whose handles the fetcher no longer searches.
