# Flashbots Research publications. The monthly fetcher workflow appends new
# candidates here via a PR; edits by hand are fine too. For entries the
# fetcher cannot find, prefer publications-manual.yaml.
#
# The site (research.flashbots.net) is built from this file by
# .github/workflows/pages.yml; nothing generated is committed.
# Order does not matter, the site sorts by date.
#
# Fields: category, title, date (YYYY-MM-DD), authors, url (what the site
#   links to), and optionally:
#   venue  papers only: where it was published ("AFT 2026"), or "preprint"
#          if it will stay one (the fetcher then stops looking)
#   also   another version of the same work, e.g. the long read on
#          writings.flashbots.net for a paper, shown as a second link. One
#          entry per work: swap url and also to change which one leads.
# Categories: Academic Papers, Flashbots Writings,
#   Flashbots Collective Forum Posts, ethresear.ch Post
# Tag every Flashbots-affiliated author with "(Flashbots)"; the site
# underlines exactly those.
# Quote any value containing ": " (e.g. title: 'A: B'), or YAML will not parse.

