<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashbots Research — Publications</title>
<meta name="description" content="Papers, writings, and research posts from the Flashbots research team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1013;
  --panel:#14181D;
  --rule:#222A32;
  --rule-soft:#1A2027;
  --ink:#E8ECF1;
  --muted:#7E8B99;
  --dim:#5A6673;
  --accent:#FFB020;
  --accent-soft:rgba(255,176,32,.14);
  --focus:#7CC6FF;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --serif:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--rule);padding:56px 0 28px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin:0 0 18px
}
.masthead h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(38px,7vw,64px);
  line-height:1.02;letter-spacing:-.02em;margin:0 0 16px
}
.masthead h1 em{font-style:italic;color:var(--muted)}
.datalinks{font-family:var(--mono);font-size:12px;color:var(--dim);margin:24px 0 0}
.datalinks a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:1px}
.datalinks a:hover{color:var(--accent);border-color:var(--accent)}
.datalinks span{margin:0 10px;color:var(--rule)}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:10;background:rgba(13,16,19,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  padding:14px 0 12px;margin-bottom:8px
}
.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#search{
  flex:1 1 240px;min-width:0;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;
  padding:9px 12px;font-family:var(--mono);font-size:13px
}
#search::placeholder{color:var(--dim)}
#search:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.count{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.count b{color:var(--accent);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  background:transparent;color:var(--muted);border:1px solid var(--rule);
  border-radius:2px;padding:5px 9px;cursor:pointer
}
.chip:hover{color:var(--ink);border-color:var(--dim)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.chip[aria-pressed="true"]{
  color:var(--accent);border-color:var(--accent);background:var(--accent-soft)
}
.chip i{font-style:normal;color:var(--dim);margin-left:6px}
.chip[aria-pressed="true"] i{color:var(--accent)}

/* ---------- list ---------- */
.yearmark{
  display:flex;align-items:baseline;gap:14px;
  padding:30px 0 8px;font-family:var(--mono)
}
.yearmark span{font-size:12px;color:var(--accent);letter-spacing:.1em}
.yearmark hr{flex:1;border:0;border-top:1px solid var(--rule-soft);margin:0}

.entry{
  display:grid;grid-template-columns:96px 1fr;gap:0 20px;
  padding:16px 0;border-bottom:1px solid var(--rule-soft);
  text-decoration:none;
}
.entry:hover{background:linear-gradient(90deg,rgba(255,176,32,.05),transparent 70%)}
.entry:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stamp{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding-top:5px;white-space:nowrap}
.entry:hover .stamp{color:var(--accent)}
.body h2{
  font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.28;
  letter-spacing:-.005em;margin:0 0 5px
}
.entry:hover .body h2{color:var(--accent)}
.authors{font-size:13px;color:var(--muted);margin:0 0 7px;line-height:1.45}
.fb{color:var(--ink);border-bottom:1px solid var(--accent)}
.meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.meta em{font-style:normal;color:var(--rule)}

.empty,.error{
  font-family:var(--mono);font-size:13px;color:var(--muted);
  border:1px solid var(--rule);border-left:2px solid var(--accent);
  padding:18px 20px;margin:36px 0;line-height:1.7
}
.error code{color:var(--accent)}

footer{border-top:1px solid var(--rule);margin-top:56px;padding:24px 0 64px}
footer p{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:0}

@media (max-width:620px){
  .wrap{padding:0 18px}
  .masthead{padding:36px 0 22px}
  .entry{grid-template-columns:1fr;gap:0}
  .stamp{padding:0 0 6px}
  .body h2{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">Flashbots Research</p>
    <h1>Publications <em>&amp; research writing</em></h1>
    <p class="datalinks">
      Raw data:
      <a href="publications.json">publications.json</a><span>/</span><a href="publications.csv">publications.csv</a>
    </p>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="searchrow">
      <input id="search" type="search" placeholder="Search titles and authors…" autocomplete="off" aria-label="Search publications">
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </div>
</div>

<main class="wrap" id="list" aria-live="polite"></main>

<footer>
  <div class="wrap"><p id="footnote"></p></div>
</footer>

<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const chipsEl = document.getElementById("chips");
const searchEl = document.getElementById("search");

let PUBS = [];
let active = null;   // active category filter, null = all

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function stamp(iso){
  const [y,m,d] = iso.split("-");
  return `${MONTHS[+m-1]} ${+d} ${y}`;
}

// The source spreadsheet's convention: if any author is tagged "(Flashbots)",
// only those are Flashbots. If none are tagged, the whole author list is Flashbots.
function renderAuthors(raw){
  if(!raw) return '<span style="color:var(--dim)">Authors not listed</span>';
  const tagged = raw.includes("(Flashbots)");
  return raw.split(/,\s*/).map(name => {
    const isFb = tagged ? name.includes("(Flashbots)") : true;
    const clean = esc(name.replace(/\s*\(Flashbots\)/,"").trim());
    return isFb ? `<span class="fb">${clean}</span>` : clean;
  }).join(", ");
}

function matches(p, q){
  if(active && p.category !== active) return false;
  if(!q) return true;
  return (p.title + " " + p.authors + " " + p.category).toLowerCase().includes(q);
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const rows = PUBS.filter(p => matches(p, q));

  countEl.innerHTML = `<b>${rows.length}</b> / ${PUBS.length}`;

  if(!rows.length){
    listEl.innerHTML = `<p class="empty">No publications match that search. Try an author surname, or clear the category filter.</p>`;
    return;
  }

  let html = "", year = null;
  for(const p of rows){
    const y = p.date.slice(0,4);
    if(y !== year){
      year = y;
      html += `<div class="yearmark"><span>${y}</span><hr></div>`;
    }
    html += `<a class="entry" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="stamp">${stamp(p.date)}</div>
      <div class="body">
        <h2>${esc(p.title)}</h2>
        <p class="authors">${renderAuthors(p.authors)}</p>
        <p class="meta">${esc(p.category)} <em>·</em> ${esc(new URL(p.url).hostname.replace(/^www\./,""))}</p>
      </div>
    </a>`;
  }
  listEl.innerHTML = html;
}

function buildChips(){
  const cats = [...new Set(PUBS.map(p => p.category))]
    .sort((a,b) => PUBS.filter(p=>p.category===b).length - PUBS.filter(p=>p.category===a).length);

  const mk = (label, value, n) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.innerHTML = `${esc(label)} <i>${n}</i>`;
    b.setAttribute("aria-pressed", String(active === value));
    b.onclick = () => { active = (active === value) ? null : value; buildChips(); render(); };
    return b;
  };

  chipsEl.innerHTML = "";
  chipsEl.appendChild(mk("All", null, PUBS.length));
  cats.forEach(c => chipsEl.appendChild(mk(c, c, PUBS.filter(p => p.category === c).length)));
}

fetch("publications.json")
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    PUBS = data.sort((a,b) => b.date.localeCompare(a.date));
    buildChips();
    render();
    const latest = PUBS[0].date.slice(0,4), oldest = PUBS[PUBS.length-1].date.slice(0,4);
    document.getElementById("footnote").textContent =
      `${PUBS.length} publications, ${oldest}–${latest}. Data lives in publications.json — edit it to update this page.`;
    searchEl.addEventListener("input", render);
  })
  .catch(err => {
    listEl.innerHTML = `<p class="error">
      Couldn't load <code>publications.json</code> (${esc(err.message)}).<br><br>
      If you're opening this file directly from your computer, browsers block that.
      Run <code>python3 -m http.server</code> in this folder and visit
      <code>localhost:8000</code> instead — or just push to GitHub Pages, where it works.
    </p>`;
  });
</script>
</body>
</html>
